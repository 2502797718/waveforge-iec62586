name: Bug report
description: Report a reproducible defect in the generator, CLI, JSON input or C API
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please keep it reproducible and factual.

        **Do not report security vulnerabilities here.** Follow [SECURITY.md](../../SECURITY.md) instead.
        Do not paste standards text or copyrighted tables.

  - type: input
    id: version
    attributes:
      label: WaveForge version
      description: Output of `wg_version_string()` or the `generator_version` in the manifest.
      placeholder: "WaveForge 1.0.0"
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Build and platform
      description: Compiler, flags, OS, and commit or release tag.
      placeholder: "gcc 13.2, -std=c99 -O2, Ubuntu 24.04, commit abc1234"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command or input
      description: The CLI invocation, JSON configuration, or minimal C snippet that triggers the issue.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message and, when relevant, the manifest or verifier report.
      render: text
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / argument parsing
        - JSON configuration
        - Signal model / sampler
        - File format / writer
        - Stream API
        - Presets / scenario status
        - Verification tools
        - Build system
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Sanitizer output, `verify.py --report` JSON, or anything else that helps reproduce.
    validations:
      required: false
