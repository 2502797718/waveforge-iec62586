name: CI

on:
  push:
  pull_request:

jobs:
  cmake:
    name: CMake / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build (CMake)
        run: cmake --build build-cmake -j

      - name: Test (CTest)
        run: ctest --test-dir build-cmake --output-on-failure

  make:
    name: Make / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Make)
        shell: bash
        run: |
          set +e
          make clean
          make all selftest 2>&1 | tee make.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "error:|warning:|Error|FAIL" make.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

      - name: Self-test (Make)
        shell: bash
        run: |
          set +e
          ./build/selftest 2>&1 | tee selftest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "FAIL|Error" selftest.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi
