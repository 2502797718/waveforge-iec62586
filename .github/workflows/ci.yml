name: CI

on:
  push:
  pull_request:

jobs:
  cmake:
    name: CMake / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build (CMake)
        run: cmake --build build-cmake -j

      - name: Test (CTest)
        run: ctest --test-dir build-cmake --output-on-failure

  make:
    name: Make / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Make)
        run: make clean && make all selftest

      - name: Self-test (Make)
        run: ./build/selftest
